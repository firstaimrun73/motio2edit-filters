<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Motio2Edit — Filters</title>
  <meta name="theme-color" content="#FFFBF7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header: never changes -->
    <header class="top">
      <button type="button" id="btn-back" class="back-btn" aria-label="Back">←</button>
      <div class="top-text">
        <p class="brand">MOTIO2EDIT</p>
        <h1>Filters</h1>
        <p class="subheader">100 Motio2edit filters · live preview on your photo</p>
      </div>
      <button type="button" id="btn-replace" class="replace-btn hidden" aria-label="Replace photo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
    </header>

    <!-- UPLOAD GATE — Screenshot 1 -->
    <section id="upload-gate" class="upload-gate">
      <label class="dropzone" id="dropzone">
        <input type="file" id="file-input" accept="image/*" hidden />
        <div class="drop-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 18v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        </div>
        <h2>Drop image or tap to upload</h2>
        <p class="body-copy">AI-powered filters · 100 looks. Live previews use your photo — no uploads needed.</p>
      </label>
      <p class="footer-note">100 looks unlock after you upload</p>
    </section>

    <!-- EDITOR — after upload -->
    <section id="editor" class="editor hidden">
      <div class="stage" id="stage">
        <div id="photo-wrap" class="photo-wrap">
          <img id="main-photo" alt="Your photo" crossorigin="anonymous" />
          <div id="overlays"></div>
        </div>
        <div id="busy" class="busy hidden">Working…</div>
      </div>

      <!-- Top action row: Restart · Compare · Download -->
      <div class="controls-bar">
        <button type="button" id="btn-reset" class="icon-btn" title="Restart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button type="button" id="btn-compare" class="icon-btn" title="Hold to compare">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="18" rx="1"/><rect x="13" y="3" width="8" height="18" rx="1"/></svg>
        </button>
        <button type="button" id="btn-download" class="icon-btn warm" title="Download">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 19h14"/></svg>
        </button>
      </div>

      <!-- Tabs FILTER / ADJUST -->
      <div class="tabs-row">
        <button type="button" class="tab active" data-tab="filter">FILTER</button>
        <button type="button" class="tab" data-tab="adjust">ADJUST</button>
        <button type="button" id="btn-check" class="check" title="Done">✓</button>
      </div>

      <!-- FILTER PANEL -->
      <div id="panel-filter" class="panel">
        <div class="cats" id="cats"></div>
        <p class="count" id="count">100 looks · live preview of this photo</p>
        <div class="strip" id="strip"></div>
        <div class="intensity-row" id="intensity-row">
          <span class="intensity-label">Intensity</span>
          <input type="range" id="intensity" min="0" max="100" value="100" />
          <span id="intensity-val" class="tabular">100</span>
        </div>
      </div>

      <!-- ADJUST PANEL -->
      <div id="panel-adjust" class="panel hidden">
        <div class="adj-slider-wrap">
          <input type="range" id="adj-slider" min="-80" max="80" value="0" />
        </div>
        <div class="adj-tools" id="adj-tools"></div>
        <!-- Color sub-panel (shown when COLOR tool active) -->
        <div id="color-panel" class="color-panel hidden">
          <div class="color-toggle">
            <button type="button" class="ctab active" data-ctab="highlight">HIGHLIGHT</button>
            <button type="button" class="ctab" data-ctab="shadow">SHADOW</button>
          </div>
          <div class="color-dots" id="color-dots"></div>
          <input type="range" id="color-slider" min="0" max="100" value="40" />
        </div>
      </div>
    </section>
  </div>

  <input type="file" id="file-input-2" accept="image/*" hidden />
  <script src="/app.js"></script>
</body>
</html>
